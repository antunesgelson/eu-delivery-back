services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zanini_development
      MYSQL_USER: zanini
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - zanini_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4052:4052"
    depends_on:
      db:
        condition: service_healthy
volumes:
  zanini_db:
