x-api-environment: &api-environment
  NODE_ENV: development
  MYSQL_HOST: db
  MYSQL_PORT: 3306
  MYSQL_DB: ${MYSQL_DB:-zanini_development}
  MYSQL_USER: ${MYSQL_USER:-zanini}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD}
  JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 caracteres}
  HOST: 0.0.0.0
  PORT_SERVER_WEB: 4052
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4051}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4051,http://127.0.0.1:4051}
  AUTH_DELIVERY_MODE: development
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-zanini_development}
      MYSQL_USER: ${MYSQL_USER:-zanini}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MYSQL_HOST_PORT:-3308}:3306'
    volumes:
      - zanini_db:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  migrate:
    build: .
    environment: *api-environment
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/database/data-source.js',
      ]
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: *api-environment
    ports:
      - '127.0.0.1:${API_PORT:-4052}:4052'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4052/health/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s
volumes:
  zanini_db:
